<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Moment Engineering Contacts</title>
<style>
:root{--bg:#f6f7f3;--panel:#fff;--ink:#202722;--muted:#73796d;--line:#dcded9;--green:#2f6f58;--dark:#195a42;--soft:#f0f7f3;--danger:#a43b32;--sans:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 var(--sans)}button,input,select{font:inherit}.app-tabs{display:flex;align-items:center;gap:8px;overflow-x:auto;padding:12px 16px;background:#fff;border-bottom:1px solid #e6e6e2}.app-logo{width:170px;height:42px;flex:0 0 auto;object-fit:contain;object-position:left center;margin-right:6px}.app-tabs a{flex:0 0 auto;padding:10px 13px;border:1px solid transparent;border-radius:8px;color:var(--green);text-decoration:none;font-weight:500;white-space:nowrap}.app-tabs a:hover{background:var(--soft)}.app-tabs a.active{border-color:#b9d2c6;background:#f4faf7;color:var(--dark)}main{width:min(1050px,calc(100% - 28px));margin:30px auto 60px;display:grid;gap:18px}.head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px}.head h1{margin:0;font-size:27px}.head p{margin:5px 0 0;color:var(--muted)}.search{width:min(320px,100%);min-height:42px;border:1px solid var(--line);border-radius:9px;background:#fff;padding:9px 12px}.add-card{display:grid;grid-template-columns:160px minmax(150px,1fr) minmax(200px,1.3fr) auto;gap:9px;padding:14px;border:1px solid var(--line);border-radius:11px;background:#fff}.add-card input,.add-card select{min-width:0;min-height:42px;border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:#fff}.btn{min-height:42px;border:1px solid var(--green);border-radius:8px;padding:9px 14px;background:var(--green);color:#fff;font-weight:500;cursor:pointer}.groups{display:grid;gap:16px}.group{overflow:hidden;border:1px solid var(--line);border-radius:11px;background:#fff}.group-head{display:flex;align-items:center;justify-content:space-between;padding:13px 15px;border-bottom:1px solid var(--line);background:#fafbf9}.group-head h2{margin:0;font-size:17px}.count{color:var(--muted);font-size:12px}.contact{display:grid;grid-template-columns:minmax(150px,1fr) minmax(220px,1.4fr) auto;gap:10px;align-items:center;padding:12px 15px;border-bottom:1px solid #eceeea}.contact:last-child{border-bottom:0}.contact-name{font-weight:600}.contact a{color:var(--green)}.actions{display:flex;gap:6px}.small{border:1px solid var(--line);border-radius:7px;background:#fff;padding:7px 10px;cursor:pointer}.small.delete{color:var(--danger)}.empty{padding:20px;color:var(--muted);text-align:center}dialog{width:min(500px,calc(100% - 24px));padding:0;border:0;border-radius:13px;box-shadow:0 25px 70px rgba(20,30,24,.25)}dialog::backdrop{background:rgba(20,30,24,.45)}dialog form{display:grid;gap:12px;padding:20px}dialog h2{margin:0 0 4px}dialog label{display:grid;gap:5px;color:var(--muted);font-size:12px}dialog input,dialog select{min-height:42px;border:1px solid var(--line);border-radius:8px;padding:9px 11px}.dialog-actions{display:flex;justify-content:flex-end;gap:8px}
@media(max-width:650px){.app-tabs{padding:8px;gap:2px;font-size:13px}.app-logo{width:126px;height:36px;margin-right:3px}.app-tabs a{padding:9px 10px}main{width:100%;margin:0;padding:16px 12px 40px}.head{align-items:stretch;flex-direction:column}.search{width:100%;font-size:16px}.add-card{grid-template-columns:1fr}.add-card input,.add-card select{font-size:16px}.contact{grid-template-columns:1fr;gap:5px}.actions{margin-top:5px}.actions button{flex:1}.dialog-actions{align-items:stretch;flex-direction:column-reverse}.dialog-actions .btn,.dialog-actions .small{width:100%}}
.contact-history{grid-column:1/-1}.contact-history summary{cursor:pointer;color:var(--green);font-size:12px}.source-list{display:grid;gap:6px;margin-top:8px}.source{padding:8px 10px;border-radius:7px;background:#f4f7f4;color:#59635d;font-size:12px}
</style></head><body><link rel="stylesheet" href="app-shell.css"><script src="app-shell.js"></script>
<nav class="app-tabs"><img class="app-logo" src="moment-engineering-logo.png" alt="Moment Engineering"><a href="index.html">Boring Logs</a><a href="job-calendar.html">Calendar</a><a href="lab-inventory.html">Inventory</a><a href="lab-work.html">Lab Work</a><a href="lab-manual.html">Lab Manual</a><a class="active" href="contacts.html">Contacts</a><a href="me.html">Me</a></nav>
<main><header class="head"><div><h1>Contacts</h1><p>Reusable scheduling contacts saved from Boring Logs.</p></div><input class="search" id="search" type="search" placeholder="Search names or emails..."></header>
<form class="add-card" id="addForm"><select name="role"><option value="client">Client / Contractor</option><option value="subcontractor">Subcontractor</option></select><input name="name" required placeholder="Name or company"><input name="email" type="email" placeholder="Email address"><button class="btn" type="submit">Add Contact</button></form><section class="group" id="teamGroup"></section><section class="groups" id="groups"></section></main>
<dialog id="editDialog"><form id="editForm"><h2>Edit Contact</h2><input name="id" type="hidden"><label>Type<select name="role"><option value="client">Client / Contractor</option><option value="subcontractor">Subcontractor</option></select></label><label>Name or company<input name="name" required></label><label>Email<input name="email" type="email"></label><div class="dialog-actions"><button class="small" id="cancelEdit" type="button">Cancel</button><button class="btn" type="submit">Save Changes</button></div></form></dialog>
<script>
const key="moment-scheduling-contacts-v1",teamKey="moment-scheduling-team-v1";let contacts=load();const groups=document.getElementById("groups"),search=document.getElementById("search"),dialog=document.getElementById("editDialog"),editForm=document.getElementById("editForm");
function load(){try{const value=JSON.parse(localStorage.getItem(key)||"[]");return Array.isArray(value)?value:[]}catch(error){return[]}}function save(){localStorage.setItem(key,JSON.stringify(contacts))}function safe(value){return String(value||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]))}
const labels={client:"Clients",contractor:"Contractors",subcontractor:"Subcontractors"};function render(){const q=search.value.trim().toLowerCase();groups.innerHTML=Object.entries(labels).map(([role,label])=>{const list=contacts.filter(item=>item.role===role&&[item.name,item.email].join(" ").toLowerCase().includes(q)).sort((a,b)=>a.name.localeCompare(b.name));return `<section class="group"><header class="group-head"><h2>${label}</h2><span class="count">${list.length}</span></header>${list.map(item=>{const sources=Array.isArray(item.sources)?item.sources:[];return `<div class="contact"><span class="contact-name">${safe(item.name)}</span><span>${item.email?`<a href="mailto:${safe(item.email)}">${safe(item.email)}</a>`:"No email saved"}</span><span class="actions"><button class="small" data-edit="${item.id}" type="button">Edit</button><button class="small delete" data-delete="${item.id}" type="button">Delete</button></span>${sources.length?`<details class="contact-history"><summary>Saved from ${sources.length} job${sources.length===1?"":"s"}</summary><div class="source-list">${sources.map(source=>`<div class="source"><strong>${safe(source.jobType||"Job")}</strong> · ${safe(source.address||source.projectName||"No address")} ${source.date?`· ${safe(source.date)}`:""}</div>`).join("")}</div></details>`:""}</div>`}).join("")||`<div class="empty">No ${label.toLowerCase()} saved.</div>`}</section>`}).join("")}
document.getElementById("addForm").addEventListener("submit",event=>{event.preventDefault();const value=Object.fromEntries(new FormData(event.target));contacts.push({id:crypto.randomUUID?.()||String(Date.now()),...value});save();event.target.reset();render()});search.addEventListener("input",render);groups.addEventListener("click",event=>{const edit=event.target.dataset.edit,remove=event.target.dataset.delete;if(edit){const item=contacts.find(contact=>contact.id===edit);if(!item)return;editForm.elements.id.value=item.id;editForm.elements.role.value=item.role;editForm.elements.name.value=item.name;editForm.elements.email.value=item.email||"";dialog.showModal()}if(remove&&confirm("Delete this contact?")){contacts=contacts.filter(item=>item.id!==remove);save();render()}});document.getElementById("cancelEdit").onclick=()=>dialog.close();editForm.addEventListener("submit",event=>{event.preventDefault();const value=Object.fromEntries(new FormData(event.target)),item=contacts.find(contact=>contact.id===value.id);if(item)Object.assign(item,value);save();dialog.close();render()});render();
contacts.forEach(item=>{if(item.role==="contractor")item.role="client"});labels.client="Clients / Contractors";delete labels.contractor;save();render();
function renderTeamContacts(){let team=[];try{const saved=JSON.parse(localStorage.getItem(teamKey)||"[]");team=Array.isArray(saved)?saved:[]}catch(error){}const q=search.value.trim().toLowerCase(),list=team.filter(person=>[person.name,person.email].join(" ").toLowerCase().includes(q));document.getElementById("teamGroup").innerHTML=`<header class="group-head"><h2>Team Members</h2><span class="count">${list.length} · <a href="me.html">Manage on Me</a></span></header>${list.map(person=>{const scheduled=contacts.find(item=>item.role==="assignee"&&item.name===person.name),email=person.email||scheduled?.email||"";return `<div class="contact"><span class="contact-name"><span style="display:inline-block;width:11px;height:11px;margin-right:8px;border-radius:50%;background:${person.color||"#2f6f58"}"></span>${safe(person.name)}</span><span>${email?`<a href="mailto:${safe(email)}">${safe(email)}</a>`:"No email saved"}</span><span><a href="me.html">Edit team member</a></span></div>`}).join("")||`<div class="empty">No matching team members. Add them on the Me page.</div>`}`}
search.addEventListener("input",renderTeamContacts);renderTeamContacts();
</script></body></html>
