<!doctype html><html><head><meta charset="utf-8"><title>Saved data recovery</title><style>body{font:15px system-ui;margin:32px;color:#20332b}article{border:1px solid #cdd8d1;padding:16px;margin:12px 0;border-radius:8px}pre{white-space:pre-wrap}button{padding:10px}</style></head><body><h1>Saved data recovery</h1><p>This inspection does not change saved records or contact cloud storage.</p><main id="records"></main><script>
const keys=['boringLogAppState','boringLogAppState-before-last-save','moment-lab-custody-v1','moment-lab-custody-v1-before-last-save','moment-lab-custody-archive-v1'];
const esc=s=>String(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const sections=keys.map(key=>{const raw=localStorage.getItem(key);if(!raw)return `<article><h2>${key}</h2><p>No saved copy</p></article>`;try{const data=JSON.parse(raw),projects=data.projects||data.homes||[];return `<article><h2>${key}</h2><p>${projects.length} projects; ${(data.borings||[]).reduce((n,b)=>n+(b.samples||[]).length,0)||(data.homes||[]).reduce((n,h)=>n+(h.samples||[]).length,0)} samples</p><pre>${esc(projects.map(p=>[p.id,p.name||p.projectName||p.address,p.number||p.projectNumber,p.updatedAt,(p.samples||[]).length].join(' | ')).join('\n'))}</pre></article>`}catch{return `<article>${key}: unreadable saved copy</article>`}});
document.getElementById('records').innerHTML=sections.join('');
</script></body></html>
