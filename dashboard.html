<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Dashboard · Moment Engineering</title>
  <link rel="stylesheet" href="dashboard.css">
  <link rel="stylesheet" href="app-shell.css">
  <script defer src="app-shell.js"></script>
  <script defer src="dashboard.js"></script>
</head>
<body>
  <nav class="app-tabs" aria-label="Main pages"></nav>
  <main class="dashboard-page">
    <header class="dashboard-head"><div><div class="dashboard-eyebrow">Projects · Live overview</div><h1>Active Projects</h1><p>Field details, samples, and laboratory progress in one place.</p></div><label class="dashboard-search"><span>Search projects</span><input id="projectSearch" type="search" placeholder="Project, client, address…"></label></header>
    <section class="dashboard-metrics" aria-label="Project summary"><article><span>Active projects</span><strong id="activeProjectCount">0</strong></article><article><span>In lab pipeline</span><strong id="labProjectCount">0</strong></article><article><span>Awaiting lab</span><strong id="waitingProjectCount">0</strong></article><article><span>Total samples</span><strong id="sampleCount">0</strong></article></section>
    <div class="dashboard-toolbar"><div><strong>Project workspace</strong><span id="dashboardUpdated">Saved data from this device</span></div><select id="statusFilter" aria-label="Filter projects by status"><option value="all">All active projects</option><option value="lab">In lab pipeline</option><option value="testing">Testing</option><option value="report">Report phase</option><option value="waiting">Awaiting lab</option><option value="field">Field work</option></select></div>
    <section class="project-dashboard-list" id="dashboardProjects" aria-live="polite"></section>
  </main>
</body>
</html>
