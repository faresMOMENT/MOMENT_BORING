<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Moment Engineering Job Calendar</title>
  <style>
    :root{--bg:#f6f7f3;--panel:#fff;--ink:#202722;--muted:#73796d;--line:#dcded9;--green:#2f6f58;--green-dark:#195a42;--soft:#f0f7f3;--orange:#b86418;--danger:#a43b32;--sans:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 var(--sans)} button,input,select,textarea{font:inherit} button{cursor:pointer}
    .app-tabs{display:flex;align-items:center;gap:8px;overflow-x:auto;padding:12px 16px;background:#fff;border-bottom:1px solid #e6e6e2;scrollbar-width:thin}
    .app-logo{width:170px;height:42px;flex:0 0 auto;object-fit:contain;object-position:left center;margin-right:6px}
    .app-tabs a{flex:0 0 auto;padding:10px 13px;border:1px solid transparent;border-radius:8px;color:var(--green);text-decoration:none;font-weight:500;white-space:nowrap}
    .app-tabs a:hover{background:var(--soft);color:#205b46}.app-tabs a.active{border-color:#b9d2c6;background:#f4faf7;color:var(--green-dark)}
    main{width:min(1240px,calc(100% - 32px));margin:28px auto 60px;display:grid;gap:18px}.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px}.page-head h1{margin:0;font-size:26px;font-weight:600}.page-head p{margin:5px 0 0;color:var(--muted)}
    .btn{min-height:42px;border:1px solid var(--green);border-radius:9px;padding:9px 15px;background:var(--green);color:#fff;font-weight:500}.btn.secondary{background:#fff;color:var(--ink);border-color:var(--line)}
    .calendar-tools{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px;border:1px solid var(--line);border-radius:12px;background:#fff}.month-controls{display:flex;align-items:center;gap:8px}.month-title{min-width:170px;text-align:center;font-size:18px;font-weight:600}.icon-btn{width:42px;height:42px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink)}
    .calendar{overflow:hidden;border:1px solid var(--line);border-radius:12px;background:#fff}.weekdays,.month-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}.weekdays div{padding:10px;border-bottom:1px solid var(--line);color:var(--muted);font-size:12px;text-align:center}.day{min-height:128px;padding:9px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:#fff}.day:nth-child(7n){border-right:0}.day.outside{background:#fafaf8;color:#a5aaa5}.day.today .day-number{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--green);color:#fff}.day-number{margin-bottom:6px;font-size:12px}.job-chip{display:block;width:100%;margin:5px 0 0;padding:6px 7px;overflow:hidden;border:0;border-left:3px solid var(--green);border-radius:5px;background:var(--soft);color:var(--green-dark);font-size:11px;text-align:left;text-overflow:ellipsis;white-space:nowrap}.job-chip.drilling{border-color:var(--orange);background:#fff5e9;color:#8b4914}.job-chip.inspection{border-color:#456da7;background:#eef3fb;color:#315583}
    .agenda{display:none}.empty{padding:28px;color:var(--muted);text-align:center}
    dialog{width:min(560px,calc(100% - 24px));padding:0;border:0;border-radius:14px;box-shadow:0 25px 70px rgba(20,30,24,.25)}dialog::backdrop{background:rgba(20,30,24,.45)}.dialog-head{display:flex;justify-content:space-between;gap:12px;padding:18px 20px;border-bottom:1px solid var(--line)}.dialog-head h2{margin:0;font-size:20px}.close{border:0;background:transparent;font-size:24px;color:var(--muted)}form{display:grid;gap:14px;padding:20px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:grid;gap:6px;color:#59635d;font-size:12px;font-weight:500}label.full{grid-column:1/-1}input,select,textarea{width:100%;min-height:42px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:9px 11px;color:var(--ink)}textarea{min-height:84px;resize:vertical}.dialog-actions{display:flex;justify-content:space-between;gap:8px;margin-top:4px}.danger{border-color:#e6c3bf;background:#fff5f3;color:var(--danger)}
    @media(max-width:700px){.app-tabs{padding:8px;gap:2px;font-size:13px}.app-logo{width:126px;height:36px;margin-right:3px}.app-tabs a{padding:9px 10px}main{width:100%;margin:0;padding:16px 12px 40px;gap:14px}.page-head{align-items:stretch;flex-direction:column}.page-head h1{font-size:22px}.page-head .btn{width:100%}.calendar-tools{padding:9px}.month-title{min-width:0;font-size:16px}.calendar{display:none}.agenda{display:grid;gap:10px}.agenda-day{overflow:hidden;border:1px solid var(--line);border-radius:10px;background:#fff}.agenda-date{padding:10px 12px;border-bottom:1px solid var(--line);background:#fafbf9;font-size:13px;font-weight:600}.agenda-job{display:grid;grid-template-columns:54px minmax(0,1fr) 18px;gap:10px;align-items:center;width:100%;padding:12px;border:0;border-bottom:1px solid #eceeea;background:#fff;color:var(--ink);text-align:left}.agenda-job:last-child{border-bottom:0}.agenda-time{color:var(--green);font-size:12px;font-weight:500}.agenda-job strong{display:block;font-size:14px;font-weight:600}.agenda-job span{display:block;overflow:hidden;color:var(--muted);font-size:12px;text-overflow:ellipsis;white-space:nowrap}.agenda-arrow{color:#a1a7a2}.form-grid{grid-template-columns:1fr}label.full{grid-column:auto}.dialog-actions{align-items:stretch;flex-direction:column-reverse}.dialog-actions .btn{width:100%}input,select,textarea{font-size:16px}}
    .tool-left{display:flex;align-items:center;gap:8px}.assignee-filter{min-height:42px;max-width:210px;border:1px solid var(--line);border-radius:9px;background:#fff;padding:8px 10px}
    @media(max-width:700px){.calendar-tools{align-items:stretch;flex-direction:column}.tool-left{width:100%}.tool-left>*{flex:1}.assignee-filter{max-width:none}.month-controls{justify-content:space-between}}
    .mobile-view-switch{display:none;grid-template-columns:repeat(3,1fr);padding:3px;border:1px solid var(--line);border-radius:10px;background:#eef1ed}.mobile-view-switch button{min-height:38px;border:0;border-radius:7px;background:transparent;color:var(--muted)}.mobile-view-switch button.active{background:#fff;color:var(--dark);box-shadow:0 1px 4px rgba(20,30,24,.1)}
    @media(max-width:700px){.mobile-view-switch{display:grid}.calendar.mobile-month{display:block}.calendar.mobile-month .weekdays div{padding:7px 2px;font-size:10px}.calendar.mobile-month .day{min-height:58px;padding:4px}.calendar.mobile-month .day-number{margin-bottom:3px;font-size:10px}.calendar.mobile-month .job-chip{height:5px;margin:3px 0 0;padding:0;border:0;border-radius:999px;font-size:0}.calendar.mobile-month+.agenda{display:none}.agenda.mobile-list{display:grid}}
  </style>
</head>
<body>
  <link rel="stylesheet" href="app-shell.css"><script src="app-shell.js"></script>
  <nav class="app-tabs" aria-label="Main pages"><img class="app-logo" src="moment-engineering-logo.png" alt="Moment Engineering"><a href="index.html">Boring Logs</a><a class="active" href="job-calendar.html">Calendar</a><a href="lab-inventory.html">Inventory</a><a href="lab-work.html">Lab Work</a><a href="lab-manual.html">Lab Manual</a><a href="contacts.html">Contacts</a><a href="me.html">Me</a></nav>
  <main>
    <header class="page-head"><div><h1>Job Calendar</h1><p>Schedule field work, drilling, inspections, and lab jobs.</p></div><button class="btn" id="addJob" type="button">+ Schedule Job</button></header>
    <section class="calendar-tools"><div class="tool-left"><button class="btn secondary" id="todayBtn" type="button">Today</button><select class="assignee-filter" id="assigneeFilter"><option value="all">Everyone</option></select></div><div class="month-controls"><button class="icon-btn" id="prevMonth" type="button" aria-label="Previous month">&lsaquo;</button><div class="month-title" id="monthTitle"></div><button class="icon-btn" id="nextMonth" type="button" aria-label="Next month">&rsaquo;</button></div></section>
    <div class="mobile-view-switch" id="mobileViewSwitch"><button class="active" data-mobile-view="month" type="button">Month</button><button data-mobile-view="week" type="button">Week</button><button data-mobile-view="day" type="button">Day</button></div>
    <section class="calendar mobile-month" aria-label="Monthly job calendar"><div class="weekdays"><div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div></div><div class="month-grid" id="monthGrid"></div></section>
    <section class="agenda" id="agenda" aria-label="Scheduled jobs agenda"></section>
  </main>
  <dialog id="jobDialog"><div class="dialog-head"><h2 id="dialogTitle">Schedule Job</h2><button class="close" id="closeDialog" type="button" aria-label="Close">&times;</button></div><form id="jobForm"><input name="id" type="hidden"><div class="form-grid"><label class="full">Job title<input name="title" required placeholder="Project or job name"></label><label>Date<input name="date" type="date" required></label><label>Start time<input name="time" type="time"></label><label>Assigned to<select name="assigneeId" id="assigneeSelect"><option value="">Unassigned</option></select></label><label>Job number<input name="jobNumber" placeholder="Job number"></label><label>Type<select name="type"><option value="field">Field Work</option><option value="drilling">Drilling</option><option value="inspection">Inspection</option><option value="lab">Lab Work</option></select></label><label class="full">Location<input name="location" placeholder="Project address"></label><label class="full">Notes<textarea name="notes" placeholder="Crew, equipment, access, or other notes"></textarea></label></div><div class="dialog-actions"><button class="btn secondary danger" id="deleteJob" type="button" hidden>Delete Job</button><button class="btn" type="submit">Save Job</button></div></form></dialog>
  <script>
    const storageKey="moment-job-calendar-v1", teamKey="moment-scheduling-team-v1"; const jobs=loadJobs(); const team=loadTeam(); let assigneeFilter="all", mobileView="month", viewDate=new Date();
    const grid=document.getElementById("monthGrid"),agenda=document.getElementById("agenda"),dialog=document.getElementById("jobDialog"),form=document.getElementById("jobForm");
    function loadJobs(){try{const value=JSON.parse(localStorage.getItem(storageKey)||"[]");return Array.isArray(value)?value:[]}catch(error){return[]}}
    function loadTeam(){try{const value=JSON.parse(localStorage.getItem(teamKey)||"[]");return Array.isArray(value)?value:[]}catch(error){return[]}}
    function peopleFor(job){const ids=Array.isArray(job.assigneeIds)?job.assigneeIds:[job.assigneeId].filter(Boolean);return ids.map(id=>team.find(person=>person.id===id)).filter(Boolean)} function personFor(job){return peopleFor(job)[0]} function visible(job){return assigneeFilter==="all"||(assigneeFilter===""?!((job.assigneeIds?.length)||job.assigneeId):(job.assigneeIds||[job.assigneeId]).includes(assigneeFilter))}
    function renderPeople(){const options=team.map(person=>`<option value="${person.id}">${escapeHtml(person.name)}</option>`).join("");document.getElementById("assigneeFilter").innerHTML=`<option value="all">Everyone</option><option value="">Unassigned</option>${options}`;document.getElementById("assigneeSelect").innerHTML=`<option value="">Unassigned</option>${options}`}
    function saveJobs(){localStorage.setItem(storageKey,JSON.stringify(jobs))} function iso(date){return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,"0")}-${String(date.getDate()).padStart(2,"0")}`}
    function escapeHtml(value){return String(value||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]))}
    function monthJobs(){const prefix=`${viewDate.getFullYear()}-${String(viewDate.getMonth()+1).padStart(2,"0")}`;return jobs.filter(job=>job.date.startsWith(prefix)&&visible(job)).sort((a,b)=>`${a.date} ${a.time||"99:99"}`.localeCompare(`${b.date} ${b.time||"99:99"}`))}
    function spanJobs(){if(mobileView==="month")return monthJobs();if(mobileView==="day")return jobs.filter(job=>job.date===iso(viewDate)&&visible(job)).sort((a,b)=>(a.time||"").localeCompare(b.time||""));const start=new Date(viewDate);start.setDate(start.getDate()-start.getDay());const end=new Date(start);end.setDate(end.getDate()+6);return jobs.filter(job=>job.date>=iso(start)&&job.date<=iso(end)&&visible(job)).sort((a,b)=>`${a.date} ${a.time||"99:99"}`.localeCompare(`${b.date} ${b.time||"99:99"}`))}
    function spanTitle(){if(mobileView==="day")return viewDate.toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"});if(mobileView==="week"){const start=new Date(viewDate);start.setDate(start.getDate()-start.getDay());const end=new Date(start);end.setDate(end.getDate()+6);return `${start.toLocaleDateString(undefined,{month:"short",day:"numeric"})} - ${end.toLocaleDateString(undefined,{month:"short",day:"numeric"})}`;}return viewDate.toLocaleDateString(undefined,{month:"long",year:"numeric"})}
    function render(){
      document.getElementById("monthTitle").textContent=spanTitle();document.querySelector(".calendar").classList.toggle("mobile-month",mobileView==="month");agenda.classList.toggle("mobile-list",mobileView!=="month");
      const first=new Date(viewDate.getFullYear(),viewDate.getMonth(),1),start=new Date(first);start.setDate(1-first.getDay());const today=iso(new Date());let html="";
      for(let i=0;i<42;i++){const date=new Date(start);date.setDate(start.getDate()+i);const key=iso(date),dayJobs=jobs.filter(job=>job.date===key&&visible(job)).sort((a,b)=>(a.time||"").localeCompare(b.time||""));html+=`<div class="day ${date.getMonth()!==viewDate.getMonth()?"outside":""} ${key===today?"today":""}" data-date="${key}"><div class="day-number">${date.getDate()}</div>${dayJobs.slice(0,3).map(job=>{const people=peopleFor(job),color=people[0]?.color||"#2f6f58";return `<button class="job-chip" style="border-color:${color};background:${color}18;color:${color}" data-job="${job.id}" type="button">${escapeHtml(job.time?job.time+" ":"")}${escapeHtml(job.title)}${people.length?` · ${escapeHtml(people.map(person=>person.name).join(", "))}`:""}</button>`}).join("")}${dayJobs.length>3?`<button class="job-chip" data-date-add="${key}" type="button">+${dayJobs.length-3} more</button>`:""}</div>`}
      grid.innerHTML=html;const shownJobs=spanJobs(),grouped=Object.groupBy?Object.groupBy(shownJobs,job=>job.date):shownJobs.reduce((out,job)=>((out[job.date]??=[]).push(job),out),{});
      agenda.innerHTML=Object.entries(grouped).map(([date,list])=>`<article class="agenda-day"><div class="agenda-date">${new Date(date+"T12:00:00").toLocaleDateString(undefined,{weekday:"long",month:"short",day:"numeric"})}</div>${list.map(job=>{const person=personFor(job),color=person?.color||"#2f6f58";return `<button class="agenda-job" style="border-left:4px solid ${color}" data-job="${job.id}" type="button"><span class="agenda-time" style="color:${color}">${escapeHtml(job.time||"Anytime")}</span><span><strong>${escapeHtml(job.title)}</strong><span>${escapeHtml([person?.name,job.jobNumber,job.location].filter(Boolean).join(" · ")||job.type)}</span></span><span class="agenda-arrow">&rsaquo;</span></button>`}).join("")}</article>`).join("")||`<div class="empty">No jobs scheduled for this person this month.</div>`;
    }
    function openJob(job=null,date=""){form.reset();form.elements.id.value=job?.id||"";form.elements.title.value=job?.title||"";form.elements.date.value=job?.date||date||iso(new Date());form.elements.time.value=job?.time||"";form.elements.assigneeId.value=job?.assigneeId||"";form.elements.jobNumber.value=job?.jobNumber||"";form.elements.type.value=job?.type||"field";form.elements.location.value=job?.location||"";form.elements.notes.value=job?.notes||"";document.getElementById("dialogTitle").textContent=job?"Edit Scheduled Job":"Schedule Job";document.getElementById("deleteJob").hidden=!job;dialog.showModal()}
    function moveSpan(direction){if(mobileView==="day")viewDate.setDate(viewDate.getDate()+direction);else if(mobileView==="week")viewDate.setDate(viewDate.getDate()+7*direction);else viewDate.setMonth(viewDate.getMonth()+direction);render()}
    document.getElementById("addJob").onclick=()=>openJob();document.getElementById("closeDialog").onclick=()=>dialog.close();document.getElementById("todayBtn").onclick=()=>{viewDate=new Date();render()};document.getElementById("prevMonth").onclick=()=>moveSpan(-1);document.getElementById("nextMonth").onclick=()=>moveSpan(1);
    document.getElementById("mobileViewSwitch").addEventListener("click",event=>{const button=event.target.closest("[data-mobile-view]");if(!button)return;mobileView=button.dataset.mobileView;document.querySelectorAll("[data-mobile-view]").forEach(item=>item.classList.toggle("active",item===button));render()});
    document.addEventListener("click",event=>{const jobButton=event.target.closest("[data-job]");if(jobButton){openJob(jobs.find(job=>job.id===jobButton.dataset.job));return}const day=event.target.closest(".day");if(day)openJob(null,day.dataset.date)});
    form.addEventListener("submit",event=>{event.preventDefault();const value=Object.fromEntries(new FormData(form));if(!value.title.trim()||!value.date)return;const existing=jobs.find(job=>job.id===value.id);const saved={...value,id:value.id||(crypto.randomUUID?.()||String(Date.now()))};if(existing)Object.assign(existing,saved);else jobs.push(saved);saveJobs();dialog.close();viewDate=new Date(`${value.date}T12:00:00`);render()});
    document.getElementById("assigneeFilter").onchange=event=>{assigneeFilter=event.target.value;render()};document.getElementById("deleteJob").onclick=()=>{const index=jobs.findIndex(job=>job.id===form.elements.id.value);if(index<0||!confirm("Delete this scheduled job?"))return;jobs.splice(index,1);saveJobs();dialog.close();render()};renderPeople();render();
  </script>
</body>
</html>
