<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; background: #f5f5f2; overflow: hidden; height: 100vh; }
:root {
  --primary: #3d5a1e; --primary-light: #5a7a30; --primary-faint: #e6eedd;
  --accent: #2d4416; --bg: #f5f5f2; --panel: #fff; --border: #ddd9d3;
  --text: #1a1a1a; --muted: #7a7a7a; --red: #b83226; --green: #2e7d32;
  --orange: #d4790a; --purple: #6a3d8c;
}
.app { display: flex; height: 100vh; }
.left-panel { width: 250px; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow-y: auto; overflow-x: hidden; flex-shrink: 0; font-size: 12px; }
.canvas-area { flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; padding: 10px; min-width: 0; }
.right-panel { width: 270px; background: var(--panel); border-left: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; flex-shrink: 0; font-size: 12px; }
.sec { padding: 8px 10px 5px; }
.sec-label { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
.tool-btn { display: flex; align-items: center; gap: 7px; padding: 7px 10px; border-radius: 5px; border: 1px solid var(--border); background: #fff; cursor: pointer; font-size: 12px; width: 100%; text-align: left; color: var(--text); }
.tool-btn:hover { border-color: var(--primary); }
.tool-btn.active { border: 2px solid var(--primary); background: var(--primary-faint); font-weight: 700; color: var(--primary); }
.sm-btn { padding: 6px 10px; border-radius: 4px; border: 1px solid var(--border); background: #fff; cursor: pointer; font-size: 11px; color: var(--text); }
.sm-btn:hover { border-color: var(--primary); }
.sm-btn.danger { color: var(--red); border-color: var(--red); }
.sm-btn:disabled { background: #f0f0f0; color: var(--muted); cursor: default; }
input[type="text"], input[type="number"], select { padding: 5px 8px; border: 1px solid var(--border); border-radius: 4px; font-size: 12px; width: 100%; box-sizing: border-box; font-family: inherit; }
input[type="range"] { width: 100%; }
label.opt { display: flex; align-items: center; gap: 6px; font-size: 12px; cursor: pointer; margin-bottom: 4px; }
.export-btn { width: 100%; padding: 10px 6px; border-radius: 5px; border: none; cursor: pointer; font-size: 12px; color: #fff; font-weight: 700; }
.tab-bar { display: flex; border-bottom: 1px solid var(--border); }
.tab-btn { flex: 1; padding: 9px 4px; font-size: 11px; border: none; border-bottom: 2px solid transparent; cursor: pointer; background: transparent; color: var(--muted); }
.tab-btn.active { font-weight: 700; color: var(--primary); background: var(--primary-faint); border-bottom-color: var(--primary); }
.el-row { display: flex; align-items: center; gap: 6px; padding: 6px 8px; border-radius: 4px; cursor: pointer; margin-bottom: 2px; border: 1px solid transparent; }
.el-row:hover { background: #f5f5f0; }
.el-row.sel { background: var(--primary-faint); border-color: var(--primary-light); }
.ctx-menu { position: fixed; background: #fff; border: 1px solid #ddd9d3; border-radius: 6px; box-shadow: 0 4px 16px rgba(0,0,0,0.18); z-index: 200; min-width: 160px; padding: 4px 0; font-size: 12px; }
.ctx-item { padding: 7px 14px; cursor: pointer; display: flex; align-items: center; gap: 8px; color: #1a1a1a; }
.ctx-item:hover { background: #e6eedd; }
.ctx-item.danger { color: #b83226; }
.ctx-item.danger:hover { background: #fde8e6; }
.ctx-sep { height: 1px; background: #ddd9d3; margin: 3px 0; }
.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; z-index: 2200; }
.modal { background: #fff; border-radius: 10px; padding: 24px; box-shadow: 0 12px 40px rgba(0,0,0,0.2); }
.template-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; max-width: 720px; width: 100%; }
.template-card { background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 24px 16px; cursor: pointer; text-align: left; transition: all 0.15s; }
.template-card:hover { border-color: var(--primary); box-shadow: 0 2px 12px rgba(61,90,30,0.15); }
.canvas-wrap { box-shadow: 0 4px 24px rgba(0,0,0,0.12); border-radius: 4px; overflow: hidden; line-height: 0; }
.hint-bar { padding: 6px 10px; font-size: 11px; border-top: 1px solid var(--border); }
/* Selection panel */
.sel-panel { padding: 10px 10px 8px; border-bottom: 1px solid var(--border); background: var(--primary-faint); }
@media(max-width:900px){.app{height:calc(100vh - 72px)}}
</style>

/* ── Tile math ── */
function lonLatToTile(lon, lat, z) {
  const n = 2**z;
  return { x: Math.floor((lon+180)/360*n), y: Math.floor((1-Math.log(Math.tan(lat*Math.PI/180)+1/Math.cos(lat*Math.PI/180))/Math.PI)/2*n) };
}
function tileToBBox(tx,ty,z) {
  const n = 2**z;
  return { lonL: tx/n*360-180, lonR: (tx+1)/n*360-180,
    latT: Math.atan(Math.sinh(Math.PI*(1-2*ty/n)))*180/Math.PI,
    latB: Math.atan(Math.sinh(Math.PI*(1-2*(ty+1)/n)))*180/Math.PI };
}

async function geocodeAddress(addr) {
  try {
    const r = await fetch("https://nominatim.openstreetmap.org/search?format=json&q=" + encodeURIComponent(addr) + "&limit=1&countrycodes=us", { headers: { "User-Agent": "MomentEngTool/1.0" } });
    if (!r.ok) return null;
    const d = await r.json();
    if (d.length > 0) return { lat: parseFloat(d[0].lat), lon: parseFloat(d[0].lon), display: d[0].display_name };
    return null;
  } catch(e) { console.error("Geocode error:", e); return null; }
}

async function fetchMapTiles(lat, lon, zoom, srcKey, w, h) {
  const src = MAP_SOURCES[srcKey] || MAP_SOURCES.topo;
  const ct = lonLatToTile(lon, lat, zoom);
  const tx = Math.ceil(w/256)+2, ty = Math.ceil(h/256)+2;
  const sx = ct.x - Math.floor(tx/2), sy = ct.y - Math.floor(ty/2);
  const cv = document.createElement("canvas"); cv.width = tx*256; cv.height = ty*256;
  const ctx = cv.getContext("2d");
  const proms = [];
  for (let dy=0; dy<ty; dy++) for (let dx=0; dx<tx; dx++) {
    const txx=sx+dx, tyy=sy+dy, url=src.url(zoom,txx,tyy);
    proms.push(new Promise(res => { const img=new Image(); img.crossOrigin="anonymous"; img.onload=()=>{ctx.drawImage(img,dx*256,dy*256);res();}; img.onerror=()=>res(); img.src=url; }));
  }
  await Promise.all(proms);
  if (srcKey === "hazard" && src.overlay) {
    try {
      const bb1=tileToBBox(sx,sy,zoom), bb2=tileToBBox(sx+tx-1,sy+ty-1,zoom);
      const bbox=`${bb1.lonL},${bb2.latB},${bb2.lonR},${bb1.latT}`;
      const wUrl=`${src.overlay}?bbox=${bbox}&bboxSR=4326&imageSR=4326&size=${cv.width},${cv.height}&format=png32&transparent=true&f=image`;
      const oi=new Image(); oi.crossOrigin="anonymous";
      await new Promise(res=>{oi.onload=()=>{ctx.globalAlpha=0.55;ctx.drawImage(oi,0,0,cv.width,cv.height);ctx.globalAlpha=1;res();};oi.onerror=()=>res();oi.src=wUrl;});
    } catch(e){}
  }

function metersPerPixel(lat,zoom){return 156543.03*Math.cos(lat*Math.PI/180)/Math.pow(2,zoom);}
function computeScaleText(lat,zoom,imgScale){
  if(!lat||!zoom)return"AS SHOWN";
  var mpp=metersPerPixel(lat,zoom),canvasMpp=mpp/(imgScale||1),barMeters=canvasMpp*100,barFeet=barMeters*3.28084;
  if(barFeet>=5280)return Math.round(barFeet/5280*10)/10+" mi";if(barFeet>=100)return Math.round(barFeet/10)*10+"'";return Math.round(barFeet)+"'";

/* ══════════════════════════════════════════════════════
   TEXT WRAPPING HELPER
   ══════════════════════════════════════════════════════ */
function wrapText(ctx,text,maxWidth){
  if(!text)return[""];
  if(!maxWidth)return text.split("\n");
  var result=[];
  text.split("\n").forEach(function(para){
    var words=para.split(/\s+/);if(!words.length||!words[0]){result.push("");return;}
    var line=words[0];
    for(var i=1;i<words.length;i++){
      var test=line+" "+words[i];
      if(ctx.measureText(test).width>maxWidth){result.push(line);line=words[i];}
      else line=test;
    }
    result.push(line);
  });
  return result;
}

    if(!geo){S.mapStatus="Address not found. Try: '123 Main St, Los Angeles, CA'";S.mapLoading=false;renderPanels();return;}

    try { loadImgSrc(tc.toDataURL("image/png")); } catch(ce) { loadImgSrc(tc.toDataURL("image/jpeg",0.9)); }

    S.titleInfo.scale='1\" = '+S.scaleText;

    if(!siteExists){
      pushUndo();
      var cx=DA.x+DA.w/2, cy=DA.y+DA.h/2;
      var siteEl={id:"el-"+Date.now(),kind:"symbol",type:"SITE",x:cx,y:cy,label:"SITE",color:S.symColor};setElPos(siteEl,cx,cy);S.elements.push(siteEl);S.showLegend=true;

  S.mapLoading=false; renderPanels();
}
